name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detections:
    name: Detection rules (scenario tests + conversion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Every rule must fire on its attack scenarios and stay quiet on the look-alikes
        run: socdet test
      - name: Generated docs and sample hunt must match the rules
        run: |
          python scripts/make_sample_logs.py
          socdet docs
          socdet hunt --logs windows=samples/windows-security.jsonl --logs aws=samples/cloudtrail.jsonl -o docs/sample-hunt.md
          cat docs/sample-hunt.md >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code -- samples/ docs/rules.md docs/coverage.md docs/sample-hunt.md

  test:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  lint:
    name: Lint and security lint (ruff, incl. Bandit rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .
