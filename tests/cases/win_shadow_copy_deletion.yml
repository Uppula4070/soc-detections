scenarios:
  - name: vssadmin delete shadows
    expect: 1
    events:
      - {EventID: 4688, NewProcessName: 'C:\Windows\System32\vssadmin.exe', CommandLine: 'vssadmin.exe Delete Shadows /All /Quiet'}
  - name: wmic shadowcopy delete
    expect: 1
    events:
      - {EventID: 4688, NewProcessName: 'C:\Windows\System32\wbem\WMIC.exe', CommandLine: 'wmic shadowcopy delete'}
  - name: listing shadow copies is fine
    expect: 0
    events:
      - {EventID: 4688, NewProcessName: 'C:\Windows\System32\vssadmin.exe', CommandLine: 'vssadmin list shadows'}