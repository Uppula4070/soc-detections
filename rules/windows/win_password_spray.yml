title: Password Spray - Failed Logons to Many Accounts From One Source
id: 9a3d7e60-1f4b-4c2e-8d05-6b9e3a1c2f42
status: stable
description: |
  Failed logons for more than 5 different user names from one source IP within 10 minutes. A spray
  tries one common password against many accounts to stay under lockout thresholds, so it is missed
  by per-account brute force rules.
author: Vaishnavi U
date: 2026-10-27
tags:
  - attack.credential_access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  timeframe: 10m
  condition: selection | count(TargetUserName) by IpAddress > 5
falsepositives:
  - A shared jump host where several users mistype passwords at the same time
level: high